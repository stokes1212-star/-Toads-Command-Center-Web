lumns:repeat(2,minmax(0,1fr))}.scrap-item h4{margin:0 0 8px;font-size:1rem}.special-stat{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin:9px 0}.special-stat label{min-width:0}.special-stat button{align-self:end}.special-gear{margin-bottom:12px}.rarity-rare{color:#64adff}.rarity-epic{color:#bd89ff}.rarity-legendary{color:#ef9b46}@media(max-width:480px){.special-stat{grid-template-columns:1fr 1fr}.special-stat label:first-child{grid-column:1/-1}} .info-skill{padding:12px;border-radius:9px;background:#242e46;margin:8px 0}.lineup-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:12px 0}.lineup-slot{font-size:.76rem;text-align:center;overflow-wrap:anywhere;border:1px solid #48516a;border-radius:8px;padding:10px 3px;background:#202a40}.lineup-slot.ready{border-color:#43b795}.lineup-slot.unknown{border-color:#b78b50}.milestone-inline{display:flex;gap:7px;flex-wrap:wrap}.milestone-inline span{padding:8px;border:1px solid #48516a;border-radius:8px;background:#202a40} </style></head><body><header><div><small>TILES SURVIVE · COMMUNITY TOOL</small><h1 id=\"trackerHeading\">🐸 Toad's Hero Tracker</h1><small>Blank starter • Your progress stays on this device</small></div><button id=\"backupTop\">Backup</button></header><nav><button class=\"active\" data-tab=\"dashboard\">Overview</button><button data-tab=\"heroes\">Heroes</button><button data-tab=\"info\">Hero Info</button><button data-tab=\"lineups\">Lineup Guide</button><button data-tab=\"sr\">SR Promo</button><button data-tab=\"gear\">Gear</button><button data-tab=\"special\">Gear Special Stats</button><button data-tab=\"settings\">Data</button></nav><section id=\"dashboard\" class=\"active\"><div class=\"stats\"><div class=\"stat\"><small>Heroes tracked</small><b id=\"count\">0</b></div><div class=\"stat\"><small>10★ heroes</small><b id=\"maxed\">0</b></div><div class=\"stat\"><small>SR heroes tracked</small><b id=\"srcount\">7</b></div></div><div class=\"card\"><h2>Your tracker</h2><p class=\"note\">Track hero levels, skills, fragments, signature gear, and milestone gear upgrades. Heroes can be sorted by faction, personal priority, star level, or name. This prototype uses the hero names and tab structure of the original tracker, but starts everyone at zero. No accounts or uploads.</p><div class=\"grid\"><label>Player name<input data-setting=\"player\" placeholder=\"Your game name\"></label><label>Main march power (millions)<input data-setting=\"power\" type=\"number\" step=\".01\" min=\"0\"></label><label>Play style<input data-setting=\"style\" placeholder=\"e.g. Aggressive\"></label></div></div><div class=\"card\"><h3>Quick start</h3><p class=\"note\">Open Heroes to enter your roster. SR Promo tracks each hero’s fragments toward 2,500. Use Data to save a backup before switching phones.</p></div></section><section id=\"heroes\"><div class=\"toolbar\"><select id=\"search\" aria-label=\"Find a hero\"><option value=\"\">All heroes</option></select><select id=\"heroSort\" aria-label=\"Sort heroes\"><option value=\"faction\">Faction</option><option value=\"priority\">My priority</option><option value=\"stars\">Star level</option><option value=\"name\">Name A–Z</option></select><select id=\"topFaction\" aria-label=\"Move faction to top\"><option value=\"\">Faction at top: Default</option><option value=\"Stalwarts\">Stalwarts first</option><option value=\"Rovers\">Rovers first</option><option value=\"Aeronauts\">Aeronauts first</option><option value=\"Mariners\">Mariners first</option></select><button id=\"addHero\">+ Hero</button></div><p class=\"note\">Sort by faction, personal priority, stars, or name. Choose any faction to bring its entire group to the top while the other groups stay together. Maddie is an Aeronaut; faction sorting groups Stalwarts, Rovers, Aeronauts, and Mariners.</p><div id=\"heroList\"></div></section><section id=\"info\"><div class=\"card\"><h2>Hero Information</h2><p class=\"note\">Linked to your existing tracked skill levels. Skill 4 calculates automatically for SSR heroes; it never needs manual entry.</p><label>Choose hero<select id=\"infoHero\"></select></label></div><div id=\"infoDetails\"></div></section><section id=\"lineups\"><div class=\"card\"><h2>Lineup Guide</h2><p class=\"note\">Starter lineup templates for comparison, not verified combat rankings. Owned status is based on your recorded hero levels or stars; a zero-progress hero is marked unconfirmed.</p><label>Formation filter<select id=\"lineupFilter\"><option value=\"all\">All formations</option><option value=\"Spear\">Spear</option><option value=\"Shield\">Shield</option><option value=\"Aeronaut\">Aeronaut</option><option value=\"Hybrid\">Hybrid</option></select></label></div><div id=\"lineupDetails\"></div></section><section id=\"sr\"><div class=\"card\"><h2>SR promotion fragments</h2><p class=\"note\">Each SR hero has an individual 2,500-fragment goal. Counts are never combined.</p><div id=\"srList\" class=\"sr-grid\"></div></div></section><section id=\"gear\"><div class=\"card\"><h2>Scrap inventory</h2><p class=\"note\">Enter the number of scraps you own. Blue = 100 EXP, purple = 400 EXP, orange = 2,000 EXP.</p><div class=\"scrap-grid\" id=\"scrapInventory\"></div><div class=\"gear-summary scrap-totals\"><div><small>Total scraps</small><b id=\"scrapCount\">0</b></div><div><small>Total available EXP</small><b id=\"scrapExpTotal\">0</b></div></div></div><div class=\"card\"><h2>Gear upgrade planner</h2><p class=\"note\">Enter a gear piece’s current level and the EXP already invested toward its next 10-level milestone. Costs come from Ghost’s blue-scrap table (1 blue scrap = 100 EXP). A level by itself cannot reveal the EXP already invested.</p><div class=\"grid\"><label>Gear type<select id=\"gearType\"><option value=\"Helmet\">Helmet</option><option value=\"Jacket\">Jacket</option><option value=\"Greaves\">Greaves</option></select></label><label>Current star level<input id=\"gearStars\" type=\"number\" min=\"0\" max=\"6\" step=\"1\" value=\"0\"></label><label>Current level<input id=\"gearLevel\" type=\"number\" min=\"1\" max=\"80\" value=\"1\"></label><label>Character equipped<select id=\"gearCharacter\"></select></label></div><div class=\"toolbar\"><button id=\"addGear\" class=\"primary\">+ Add gear piece</button></div><p class=\"note\" id=\"gearHelp\"></p></div><div class=\"toolbar\"><label for=\"gearSort\">Sort gear by <select id=\"gearSort\"><option value=\"added\">Date added</option><option value=\"type\">Gear type (Helmet → Jacket → Greaves)</option><option value=\"levelDesc\">Level (highest first)</option><option value=\"levelAsc\">Level (lowest first)</option><option value=\"starsDesc\">Stars (highest first)</option><option value=\"character\">Character equipped (A–Z)</option></select></label></div><div id=\"gearList\"></div><div class=\"card\"><h3>Ghost's milestone costs</h3><div id=\"gearCosts\"></div><small>Totals for planning are based on rare (blue) gear scraps. Other scrap rarities may have different EXP values.</small></div></section><section id=\"special\"><div class=\"card\"><h2>Gear special stats</h2><p class=\"note\">Track reforge bonuses separately from gear upgrade planning. Each piece is linked to its equipped hero in the Gear tab. Add as many special stats as needed and mark each Rare, Epic, or Legendary.</p></div><div id=\"specialList\"></div></section><section id=\"settings\"><div class=\"card\"><h2>Back up your progress</h2><p class=\"note\">Progress is saved automatically in this browser. Export a JSON backup to move it to another phone or restore it later. Clearing browser storage may erase local progress.</p><div class=\"toolbar\"><button id=\"export\" class=\"primary\">Export backup</button><button id=\"import\">Import backup</button><button id=\"mergeSheet\" class=\"primary\">Merge Sheet JSON</button><input type=\"file\" id=\"sheetFile\" accept=\"application/json,.json\" hidden><input type=\"file\" :10,\"effect\":\"Health +51,200 to all heroes\",\"next\":null},{\"hero\":\"Ghost\",\"rarity\":\"R\",\"name\":\"Paint Therapy\",\"star\":10,\"effect\":\"Health +38,400 to all heroes\",\"next\":null},{\"hero\":\"Travis\",\"rarity\":\"SR\",\"name\":\"Master Sniper\",\"star\":10,\"effect\":\"Attack +800 to all heroes\",\"next\":null},{\"hero\":\"Lucky\",\"rarity\":\"SR\",\"name\":\"Sawtooth Storm\",\"star\":10,\"effect\":\"Health +57,600 to all heroes\",\"next\":null}];\nfunction render(){let q=$('search').value.toLowerCase().trim(),cls=$('classFilter').value;let out='';$('filters').style.display=['heroes','weapons','global'].includes(tab)?'flex':'none';$('classFilter').style.display=tab==='heroes'?'block':'none';if(tab==='heroes'){let arr=DATA.heroes.filter(h=>h.rarity==='SSR'&&(!cls||h.combat_class===cls)&&JSON.stringify(h).toLowerCase().includes(q));out=`<p class=\"note\">17 SSR heroes · observed skills and levels, not universal max values. Unknowns are marked. Tap a hero's sections to expand.</p><div class=\"grid\">${arr.map(heroHTML).join('')}</div>`}else if(tab==='weapons'){let arr=DATA.signature_weapons.filter(w=>JSON.stringify(w).toLowerCase().includes(q));out=`<p class=\"note\">12 documented weapons. Locked milestones are reference only. Team buffs from Jacob, Rosie and Chiron are confirmed to stack, but the final stat formula is not established.</p><div class=\"grid\">${arr.map(w=>`<article class=\"card\"><h3>${esc(w.hero)}</h3>${weaponHTML(w)}</article>`).join('')}</div>`}else if(tab==='global'){\nconst original=DATA.heroes.filter(h=>h.rarity==='SR'&&JSON.stringify(h).toLowerCase().includes(q));\nconst cards=(rarity)=>STAR_BONUSES.filter(b=>b.rarity===rarity&&JSON.stringify(b).toLowerCase().includes(q)).map(b=>`<article class=\"card\"><h3>${esc(b.hero)}</h3><div class=\"pill\">${esc(b.rarity)} · ${esc(b.star)}★ recorded</div><div class=\"skill\"><strong>${esc(b.name)}</strong><p>${esc(b.effect)}</p>${b.next?`<p class=\"small\">Next recorded bonus: ${esc(b.nex um ${esc(t.requirements.minimum_stars)} stars · all three primary skills ≥ ${esc(t.requirements.all_three_primary_skills_at_least)}</p><p class=\"small\">Evidence: ${esc(t.evidence)}</p></article>`).join('')}</div>`}else{out=`<p class=\"note\">Spear and Shield are reference formations, not hard-coded optimal recommendations. The three-march A/B/C strategy is player-confirmed.</p><div class=\"grid\">${DATA.lineup_notes.map(l=>`<article class=\"card\"><h3>${esc(l.name)}</h3><p>${l.heroes.map(esc).join(' · ')}</p><b>Mechanics</b><ul>${l.mechanics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>Unknowns</b><ul>${l.unverified.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}<article class=\"card\"><h3>Faction-based 3v3</h3><p>A and C are intended winning marches; B is a deliberate sacrifice to increase the chance of a 2–1 win.</p><p class=\"small\">Enemy deployment is random. Faction membership is not filled in where source data lacks verified faction labels.</p></article></div>`}$('content').innerHTML=out||'<p class=\"empty\">No matches</p>'}\ndocument.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}));$('search').addEventListener('input',render);$('classFilter').addEventListener('change',render);render();\n<\/script></body></html>","builder":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Tiles Survive • Smart March Builder</title><style>:root{color-scheme:dark;font-family:system-ui,Arial;background:#101722;color:#edf3fc}*{box-sizing:border-box}body{margin:0;max-width:1050px;padding:18px;margin:auto}h1{font-size:1.5rem;margin-bottom:5px}h2{font-size:1.15rem}p,.muted{color:#afbed1}section{background:#192434;border:1px solid #334256;border-radius:14px;padding:16px;margin:14px 0}button,input,select{font:inherit;border-radius:8px;padding:10px;background:#101b2a;color:white;border:1px solid #506078}button{cursor:pointer;background:#293e5b}button.primary{background:#5269d8;border-color:#7788ff}button:disabled{opacity:.45}label{display:block;font-size:.9rem;margin:7px 0}input[type=number]{width:85px}input[type=text]{width:160px}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.hero{padding:12px;background:#111c2c;border-radius:10px;border:1px solid #35445b}.hero strong{display:block;margin-bottom:8px}.small{font-size:.83rem;color:#afbed1}.pill{border:1px solid #536783;border-radius:30px;padding:3px 8px;font-size:.8rem}.result{border-left:4px solid #8fa5ff;padding:12px;background:#101b2a;margin:10px 0;border-radius:7px}.slots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.slot{padding:8px;background:#293c55;border-radius:8px;flex:1;min-width:120px}details{margin-top:10px}summary{cursor:pointer}#status{min-height:22px}a{color:#b3c4ff}</style><style>\nbody{max-width:850px;padding:12px}h1{font-size:1.3rem}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:sticky;top:0;background:#101722;padding:9px 0;z-index:10}.tab{padding:12px 5px;font-size:.86rem}.tab.active{background:#5269d8;border-color:#9aaaff}.page{display:none}.page.active{display:block}.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.hero{padding:0;overflow:hidden}.hero>summary{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer;list-style:none}.hero>summary::-webkit-details-marker{display:none}.hero>summary strong{margin:0}.hero .inside{padding:12px;border-top:1px solid #35445b}.hero .avatar{height:46px;width:46px;display:grid;place-items:center;border-radius:12px;background:#354866;font-size:1.5rem;flex-shrink:0}.hero .meta{flex:1;min-width:0}.hero .meta small{display:block;color:#a9bad0;margin-top:3px}.hero .state{font-size:.75rem;color:#ffcc8c}.audit{background:#101b2a;border:1px solid #35445b;padding:12px;border-radius:9px;line-height:1.7}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.backslots{grid-template-columns:repeat(3,minmax(0,1fr))}.slot{min-width:0;text-align:center;word-break:break-word;padding:13px 5px}.slot .name{font-weight:700}.slot .faction{font-size:.72rem;color:#acbcd0}.result h3{font-size:1rem}.result{margin:14px 0}.hero .inside label{display:block}.hero .inside input{max-width:100%}@media(max-width:450px){.hero-grid{grid-template-columns:1fr}section{padding:12px}.slot{font-size:.8rem}}\n</style></head><body><h1>🛡️ Smart March Builder <span class=\"pill\">Prototype v0.9.2</span></h1><p>Offline, synergy-first lineup testing. Review your hero data before running recommendations. Star rank is required for ranking. Your data stays in this browser unless you export it.</p><nav class=\"tabs\" aria-label=\"Builder pages\"><button class=\"tab active\" data-tab=\"heroes\">👥 Heroes</button><button class=\"tab\" data-tab=\"builder\">🛡️ March Builder</button><button class=\"tab\" data-tab=\"tests\">📊 Battle Tests</button></nav><div id=\"page-heroes\" class=\"page active\"><section><h2>Hero encyclopedia & roster</h2><div id=\"rosterAudit\" class=\"audit\"></div><p class=\"small\">Tap a hero to inspect documented skills, signature weapon, and editable tracked progression. No hero artwork is embedded because verified portrait assets were not supplied.</p><p class=\"small\">Start with your real heroes. Load our documented SSR heroes with the button below. Unknown faction, class, stars, and skill levels are intentionally not invented. Star ranks must be entered before ranking. Review automatically inferred skill tags before treating rankings as reliable. Synergy tags contribute 35% of the score.</p><div class=\"row\"><button id=\"add\">+ Add hero</button><button id=\"seed\">Load documented SSR heroes</button><button id=\"export\">Export JSON</button><label style=\"margin:0\">Import JSON <input type=\"file\" id=\"import\" accept=\".json,application/json\"></label><button id=\"reset\">Clear roster</button></div><div id=\"roster\" class=\"hero-grid\"></div></section></div><div id=\"page-builder\" class=\"page\"><section><h2>Build settings</h2><div class=\"row\"><label>Strategy <select id=\"mode\"><option value=\"balanced\">Balanced</option><option value=\"attack\">Aggressive attack</option><option value=\"defense\">Defensive stand</option></select></label><label>Locked hero <select id=\"locked\"><option value=\"\">None</option></select></label><label>Enemy faction <select id=\"enemy\"><option value=\"\">Unknown</option><option>Stalwart</option><option>Aeronaut</option><option>Rover</option></select></label></div><button id=\"build\" class=\"primary\">Find best marches</button><p id=\"status\" class=\"small\"></p></section><section><h2>Recommendations</h2><div id=\"results\"><p>Track at least five available heroes to generate recommendations.</p></div></section></div><div id=\"page-tests\" class=\"page\"><section><h2>Battle-test benchmarks</h2><p class=\"small\">Observed against level 27 Noctis Acolyte, 125,000 troops, darkness resistance 4,050/3,750. These are complete march + equipment configurations, not isolated hero effects. Lower casualties are better.</p>\n<div style=\"overflow-x:auto\"><table style=\"width:100%;text-align:left;border-spacing:8px\"><thead><tr><th>March</th><th>Gear</th><th>Power</th><th>Casualties</th></tr></thead><tbody>\n<tr><td>Rover</td><td>Original</td><td>81.11M</td><td>4,000</td></tr>\n<tr><td>Rover</td><td>Swapped</td><td>66.08M</td><td>7,150</td></tr>\n<tr><td>Stalwart</td><td>Original</td><td>64.23M</td><td>10,980</td></tr>\n<tr><td>Stalwart</td><td>Swapped</td><td>79.25M</td><td>5,640</td></tr>\n</tbody></table></div><p class=\"small\">Benchmarks validate that equipment matters and march power alone is insufficient. They do not establish a reliable casualty-prediction formula. Benchmark gear is recorded for historical comparison only and is not used in recommendations.</p></section><section><h2>Rules and limitations</h2><p class=\"small\">Confirmed faction health tiers: 2 = 2%, 2+2 = 4%, 3 = 8%, 3+2 = 12% plus 5% counter damage, 4 = 18% plus 5%, 5 = 25% plus 5%. Mariners are wildcards for faction synergy. Faction counter cycle: Stalwart → Aeronaut → Rover → Stalwart (+20% favorable damage). Class counters are deliberately disabled until verified; known hero classes are used only for positioning.</p><p class=\"small\">This prototype uses <b>transparent, adjustable heuristic scoring</b>, not simulated game damage. Skill tags must be entered from verified skill descriptions. Star progression contributes to the 20% progression score and modestly scales tagged contributions. Synergy contributes 35%, combat 20%, positioning 15%, faction health 10%, and progression 20%. Unknown enemy counters are neutral. All transferable gear and displayed hero power are excluded. Verified unlocked signature-weapon abilities contribute to synergy and combat; raw weapon stats and weapon level alone do not award points. Target selection, attack range, and exact skill timing are documented but not numerically simulated. Faction counters are estimated only when an enemy faction is selected. Guard melee engagement and ranged positioning inform placement. Back-row guards may be delayed reinforcements; actual movement, targeting, and damage are not simulated. Results are hypotheses to battle-test, not guaranteed wins.</p></section></div><script>(function(){\nif(!window.ToadBackupBridge)return;\nconst originalClick=HTMLAnchorElement.prototype.click;\nHTMLAnchorElement.prototype.click=function(){\n const a=this;\n if(a.download && typeof a.href==='string' && a.href.startsWith('blob:')){\n   fetch(a.href).then(r=>r.blob()).then(blob=>{\n     const reader=new FileReader();\n     reader.onload=function(){\n       const data=String(reader.result||'') display:block;max-height:65px;margin-top:5px;image-rendering:auto}.cropgrid>div{border:1px solid #59647b;border-radius:8px;padding:6px}</style></head><body><main><h1>🐸 Toad's Screenshot Reader</h1><p>Independent diagnostic test lab v3.3.9. Import <strong>Stats</strong> and <strong>Skills</strong> screenshots. Review every result before exporting. Nothing is written to your Hero Tracker.</p>\n<section class=\"panel\"><h2>1 · Load screenshots</h2><input id=\"files\" type=\"file\" accept=\"image/*\" multiple><p class=\"muted\">Select screenshots of the same hero. Adjust each of the three skill boxes on Skills screenshots before reading. Supports phone, Fold and tablet image dimensions. OCR engine loads from the internet; image analysis runs in your browser.</p><div class=\"grid\"><button id=\"run\" class=\"primary\">🔎 Read screenshots</button><button id=\"clear\">Clear test</button></div><div id=\"status\" class=\"status\">Waiting for screenshots.</div></section>\n<div class=\"split\"><section class=\"panel\"><h2>2 · Image preview</h2><select id=\"imageSelect\"><option value=\"\">No image selected</option></select><p class=\"warning\">Skill 1/2/3 = independently adjustable · Cyan = hero level · Orange = stars. Drag inside a box to move, or use the arrow buttons. Skill box sizes are locked. Each preview now shows a processed label strip. Adjust each screenshot separately.</p><canvas id=\"preview\" style=\"touch-action:none;cursor:move\"></canvas><div id=\"crops\" class=\"cropgrid\"></div>\n<div class=\"panel\" style=\"margin-top:12px;background:#242c3c\" id=\"skillEditor\">\n<h2>Skill box fine adjustment</h2><p class=\"muted\">Select a skill, then use these large buttons to move its fixed-size OCR area. Changes immediately update the screenshot and crop previews.</p>\n<div class=\"grid\" style=\"grid-template-columns:repeat(3,minmax(0,1fr))\"><button class=\"skillPick primary\" data-skill=\"0\">Skill 1</button><button class=\"skillPick\" data-skill=\"1\">Skill 2</button><button class=\"skillPick\" data-skill=\"2\">Skill 3</button></div>\n<div style=\"max-width:330px;margin:12px auto;border:1px solid #69758e;border-radius:10px;padding:8px\"><strong id=\"editLabel\">Skill 1 zoomed OCR crop</strong><canvas id=\"editCrop\" style=\"max-height:220px;object-fit:contain;margin-top:8px\"></canvas></div>\n<label>Adjustment per tap<select id=\"pixelStep\"><option value=\"1\">1 pixel</option><option value=\"5\" selected>5 pixels</option><option value=\"10\">10 pixels</option><option value=\"25\">25 pixels</option></select></label>\n<div class=\"grid\" style=\"grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px\">\n<div><strong>Move box</strong><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px\"><span></span><button data-adjust=\"up\">↑</button><span></span><button data-adjust=\"left\">←</button><button data-adjust=\"down\">↓</button><button data-adjust=\"right\">→</button></div></div>\n<div><strong>Fixed-size OCR windows</strong><p class=\"muted\">Each skill box is locked to 181 × 179 pixels at the screenshot’s original resolution. Move using the arrow buttons.</p></div>\n</div><p class=\"muted\" id=\"boxMetrics\">Load a screenshot to adjust.</p>\n</div><div class=\"grid\" style=\"margin-top:10px\"><button id=\"resetSkills\">Reset 3 skill boxes</button><button id=\"saveSkills\">Save skill box layout</button></div><p class=\"muted\">Skill boxes begin at the original automatic positions. Saved layouts apply to new screenshots with the same image dimensions. Use the fine-adjustment buttons above if dragging is difficult.</p><details><summary>Recognition regions (debug)</summary><p>Colored rectangles show the areas sampled for OCR. Regions are relative to each screenshot, not fixed pixels.</p><label><input id=\"regions\" type=\"checkbox\" style=\"width:auto\" checked> Show sampled areas</label><pre id=\"log\"></pre></details><details open><summary>Raw OCR and detection diagnostics</summary><pre id=\"diagnostics\" style=\"white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto;font-size:.82rem;color:#d8e1fa\">Run the reader to see raw OCR results here.</pre></details></section>\n<section class=\"panel\"><h2>3 · Confirm extracted data</h2><p>Values may be incomplete or incorrect. Correct them using the game screenshots before exporting.</p><div class=\"fields\"><label>Hero name<input id=\"hero\" placeholder=\"e.g. Rosie\"></label><label>Stars<input id=\"stars\" type=\"number\" min=\"0\" max=\"10\" step=\"0.1\" placeholder=\"Verify visually\"></label><label>Hero level<input id=\"level\" type=\"number\" min=\"0\" max=\"999\" placeholder=\"e.g. 150\"></label><label>Skill 1<input id=\"s1\" type=\"number\" min=\"0\" max=\"99\"></label><label>Skill 2<input id=\"s2\" type=\"number\" min=\"0\" max=\"99\"></label><label>Skill 3<input id=\"s3\" type=\"number\" min=\"0\" max=\"99\"></label></div><p class=\"warning\">Stars are counted by color (purple/gold filled). Outline stars are ignored. Position the orange box over the star row on a Stats screenshot and verify the result.</p><div class=\"grid\"><button id=\"download\" class=\"primary\">Export reviewed JSON</button><button id=\"copy\">Copy reviewed JSON</button><button id=\"syncTracker\" class=\"primary\">Sync reviewed values to Hero Tracker</button></div><p class=\"muted\">JSON export remains available for testing. Use Sync reviewed values to update only approved, nonblank fields in the Hero Tracker.</p></section></div>\n<section class=\"panel\"><h2>Test notes</h2><p id=\"testSummary\">No screenshots read yet.</p><p class=\"muted\">Screen classification uses skill icon levels and hero-level text, rather than assuming the bottom navigation identifies the current screen. It is experimental. If a result looks wrong, edit it instead of trusting a confident-looking number.</p></section></main>\n<script>\n'use strict';\nconst $=id=>document.getElementById(id);let loaded=[],selected=0,activeSkill=0,worker=null,regionsByImage={},skillBoxes={},levelBoxes={},starBoxes={},drag=null,savedLayouts=JSON.parse(localStorage.getItem('toadReader31SkillLayouts')||'{}');\nconst setStatus=s=>$('status').textContent=s;\nconst fields=['hero','stars','level','s1','s2','s3'];\nfunction resetFields(){for(const f of fields)$(f).value='';}\nfunction num(v){const m=String(v).match(/\\d{1,3}/);return m?Number(m[0]):null;}\nfunction normalizeName(t){let lines=t.toUpperCase().replace(/[^A-Z\\n ]/g,' ').split(/\\n/).map(s=>s.trim()).filter(Boolean);let known=['ROSIE','KNOTTY','MADDIE','LAYLA','NIKOLA','RAY','TARZAN','BECCA','JACOB','CHIRON','RAGNAR','WRIGHT','SHARK','CANDY','TONY','KIKI','MIKE','TARA','UNDINE'];return known.find(k=>lines.some(l=>l.includes(k)))||lines.find(l=>l.length>=3&&l.length<=15&&!['SSR','STATS','SKILLS','GEAR'].includes(l))||'';}\nasync function getWorker(){if(worker)return worker;setStatus('Loading OCR engine. Internet is needed for first load…');if(!window.Tesseract){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('OCR engine download failed. Connect to the internet and retry.'));document.head.appendChild(s);});}worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')setStatus('Reading text: '+Math.round((m.progress||0)*100)+'%');}});await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT});return worker;}\n// Experimental background suppression: retain low-saturation bright lettering in the lower label band.\n// This is additive; the original OCR attempts and conflict protection remain intact.\nfunction removeLabelBackground(image,box,scale=5,variant='white'){\n const c=crop(image,box,scale,'normal'),ctx=c.getContext('2d',{willReadFrequently:true});\n const d=ctx.getImageData(0,0,c.width,c.height),a=d.data;\n for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){\n  const i=(y*c.width+x)*4,r=a[i],g=a[i+1],b=a[i+2];\n  const hi=Math.max(r,g,b),lo=Math.min(r,g,b),sat=hi?((hi-lo)/hi):0;\n  // White letters have high brightness and low saturation. Suppress orange, red, blue and green icon art.\n  const keep=variant==='white'?(hi>=155&&lo>=110&&sat<0.33):(hi>=135&&lo>=90&&sat<0.44);\n  const v=keep?0:255;a[i]=a[i+1]=a[i+2]=v;\n }\n ctx.putImageData(d,0,0);return c;\n}\nasync function readBackgroundRemoved(image,box,variant,psm){\n const c=removeLabelBackground(image,box,6,variant);\n await worker.setParameters({tessedit_pageseg_mode:psm,tessedit_char_whitelist:'Lv.0123456789'});\n try{return (await worker.recognize(c)).data.text.trim();}\n finally{await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,tessedit_char_whitelist:''});}\n}\nfunction crop(image,box,scale=3,mode='normal'){const c=document.createElement('canvas');let x=Math.round(box[0]*image.width),y=Math.round(box[1]*image.height),w=Math.round(box[2]*image.width),h=Math.round(box[3]*image.height);x=Math.max(0,x);y=Math.max(0,y);w=Math.min(image.width-x,w);h=Math.min(image.height-y,h);c.width=Math.max(1,w*scale);c.height=Math.max(1,h*scale);let ctx=c.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.drawImage(image,x,y,w,h,0,0,c.width,c.height);if(mode==='light'||mode==='yellow'){let d=ctx.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){let r=d.data[i],g=d.data[i+1],b=d.data[i+2];let v;if(mode==='yellow'){v=(r>150&&g>110&&b<140)||(r>170&&g>140&&b<100)||(r>200&&g>180&&b>150)?0:255;}else{v=(r>130&&g>100&&b<180)||(r>140&&g>140&&b>140)||(r>180&&g>150&&b<120)?0:255;}d.data[i]=d.data[i+1]=d.data[i+2]=v;}ctx.putImageData(d,0,0);}return c;}\nasync function read(image,box,mode='normal',psm=null,scale=4){const c=crop(image,box,scale,mode);if(psm!==null)await worker.setParameters({tessedit_pageseg_mode:psm});let out=await worker.recognize(c);if(psm!==null)await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT});return out.data.text.trim();}\nfunction skillNumber(t){\n  // Read only the digits immediately attached to the level marker.\n  // A separated digit is often icon noise: \"Lv.3 4\" is level 3, not 34.\n  const m=t.match(/(?:L\\s*[Vv]|[Ll][vV]|[1I][vV]|[Ll][VvYy])\\s*[.\\-:]?\\s*(\\d{1,2})(?!\\d)/i);\n  if(m){const n=Number(m[1]);return n>=1&&n<=40?n:null;}\n  return null;\n}\nfunction heroName(t){const known=['ROSIE','KNOTTY','MADDIE','LAYLA','NIKOLA','RAY','TARZAN','BECCA','JACOB','CHIRON','RAGNAR','WRIGHT','SHARK','CANDY','TONY','KIKI','MIKE','TARA','UNDINE'];let clean=t.toUpperCase().replace(/[^A-Z]/g,'');let exact=known.find(n=>clean.includes(n));if(exact)return exact;\n const tokens=t.toUpperCase().match(/[A-Z]{3,}/g)||[];\n const dist=(a,b)=>{let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row;}return prev[b.length];};\n let found=new Set();for(let word of tokens)for(let n of known)if(Math.abs(word.length-n.length)<=1&&dist(word,n)<=1)found.add(n);\n return found.size===1?[...found][0]:'';}\n\nfunction addRegion(i,label,box){(regionsByImage[i]??=[]).push({label,box});}\nfunction classify(img){return null;}\nfunction layoutKey(i){let im=loaded[i]?.img;return im?im.width+'x'+im.height:'';}\nfunction defaultSkillRegions(){const b=[.12,.18,.76,.40];let q=quadrants(b);return q.slice(0,3).map(r=>[...r]);}\nfunction skillRegions(i){\n if(!skillBoxes[i])skillBoxes[i]=(savedLayouts[layoutKey(i)]||defaultSkillRegions()).map(b=>[...b]);\n return skillBoxes[i];\n}\nfunction skillRegion(i,j){return skillRegions(i)[j];}\nfunction lockSkillBox(i,j){\n const img=loaded[i]?.img;if(!img)return;\n const b=skillRegion(i,j),w=Math.min(1,181/img.width),h=Math.min(1,179/img.height);\n b[0]=Math.max(0,Math.min(1-w,b[0]));b[1]=Math.max(0,Math.min(1-h,b[1]));b[2]=w;b[3]=h;\n}\nfunction lockAllSkillBoxes(i){for(let j=0;j<3;j++)lockSkillBox(i,j);}\n\nfunction levelBox(i){return levelBoxes[i]||[.33,.77,.35,.16];}\nfunction starBox(i){return starBoxes[i]||[.25,.68,.50,.08];} // default near typical star row on Stats\nfunction countStars(image,box){\n  // Divide star row into 5 slots; count purple or gold filled stars (outlines ignored)\n  const c=crop(image,box,2,'normal');\n  const ctx=c.getContext('2d',{willReadFrequently:true});\n  const d=ctx.getImageData(0,0,c.width,c.height).data;\n  const slotW=c.width/5;\n  let purple=0,gold=0;\n  for(let s=0;s<5;s++){\n    let pCount=0,gCount=0,total=0;\n    const x0=Math.floor(s*slotW),x1=Math.floor((s+1)*slotW);\n    // sample center band of each slot\n    const y0=Math.floor(c.height*0.2),y1=Math.floor(c.height*0.8);\n    for(let y=y0;y<y1;y++){\n      for(let x=x0;x<x1;x++){\n        const i=(y*c.width+x)*4;\n        const r=d[i],g=d[i+1],b=d[i+2];\n        total++;\n        // purple / magenta filled star\n        if(r>80&&b>100&&g<r*0.85&&b>g)pCount++;\n        // gold / yellow filled star\n        else if(r>160&&g>120&&b<100)gCount++;\n      }\n    }\n    const pRatio=pCount/total,gRatio=gCount/total;\n    // Require a solid fill — partial gold progress on the next star must not count\n    if(gRatio>0.18)gold++;\n    else if(pRatio>0.12)purple++;\n  }\n  // Convert to star rating: purple 1-5, then gold adds from 6\n  // Partial stars are ignored (e.g. 8.2 → 8)\n  if(gold>0)return 5+gold; // 1 gold=6 … 5 gold=10\n  return purple; // 0-5\n}\nfunction quadrants(b){let [x,y,w,h]=b;return [[x,y,w/2,h/2],[x+w/2,y,w/2,h/2],[x,y+h/2,w/2,h/2],[x+w/2,y+h/2,w/2,h/2]];}\nfunction updateSkillEditor(){\n document.querySelectorAll('.skillPick').forEach(b=>b.classList.toggle('primary',Number(b.dataset.skill)===activeSkill));\n $('editLabel').textContent='Skill '+(activeSkill+1)+' zoomed OCR crop';\n const c=$('editCrop');if(!loaded[selected]){c.width=1;c.height=1;$('boxMetrics').textContent='Load a screenshot to adjust.';return;}\n const b=skillRegion(selected,activeSkill),img=loaded[selected].img,zoom=crop(img,b,4);c.width=zoom.width;c.height=zoom.height;c.getContext('2d').drawImage(zoom,0,0);\n $('boxMetrics').textContent='Position: '+Math.round(b[0]*img.width)+', '+Math.round(b[1]*img.height)+' px · Size (locked): '+Math.round(b[2]*img.width)+' × '+Math.round(b[3]*img.height)+' px';\n}\ndocument.querySelectorAll('.skillPick').forEach(b=>b.addEventListener('click',()=>{activeSkill=Number(b.dataset.skill);updateSkillEditor();}));\ndocument.querySelectorAll('[data-adjust]').forEach(btn=>btn.addEventListener('click',()=>{\n if(!loaded[selected]){setStatus('Load a screenshot first.');return;}\n lockSkillBox(selected,activeSkill);const im=loaded[selected].img,b=skillRegion(selected,activeSkill).slice(),px=Number($('pixelStep').value),dx=px/im.width,dy=px/im.height;\n switch(btn.dataset.adjust){\n case 'up':b[1]=Math.max(0,b[1]-dy);break;\n case 'down':b[1]=Math.min(1-b[3],b[1]+dy);break;\n case 'left':b[0]=Math.max(0,b[0]-dx);break;\n case 'right':b[0]=Math.min(1-b[2],b[0]+dx);break;\n case 'wider':b[2]=Math.min(1-b[0],b[2]+dx);break;\n case 'narrower':b[2]=Math.max(12/im.width,b[2]-dx);break;\n case 'taller':b[3]=Math.min(1-b[1],b[3]+dy);break;\n case 'shorter':b[3]=Math.max(12/im.height,b[3]-dy);break;\n }\n skillRegions(selected)[activeSkill]=b;showImage();\n}));\nfunction labelStripBox(q){\n // Bottom-center band of the icon, where the level label is printed.\n return [q[0]+q[2]*.10,q[1]+q[3]*.68,q[2]*.80,q[3]*.27];\n}\nfunction showCrops(){const host=$('crops');host.innerHTML='';if(!loaded[selected])return;skillRegions(selected).forEach((b,i)=>{let d=document.createElement('div');d.textContent='Skill '+(i+1)+' OCR area';d.append(crop(loaded[selected].img,b,2));\n let strip=document.createElement('div');strip.className='muted';strip.textContent='Level label strip (original / processed / background removed)' ;strip.style.marginTop='8px';\n let stripBox=labelStripBox(b);strip.append(crop(loaded[selected].img,stripBox,4,'no 0);ctx.strokeStyle=palette[i%palette.length];ctx.strokeRect(x*c.width,y*c.height,w*c.width,h*c.height);ctx.fillStyle=palette[i%palette.length];ctx.font=`${Math.max(16,c.width/35)}px sans-serif`;ctx.fillText(r.label,x*c.width+5,Math.max(20,y*c.height-6));});}}\nfunction loadImage(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve({file,img})};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Could not open '+file.name))};img.src=url;});}\n$('files').addEventListener('change',async e=>{loaded=[];regionsByImage={};skillBoxes={};levelBoxes={};starBoxes={};resetFields();try{loaded=await Promise.all([...e.target.files].slice(0,8).map(loadImage));$('imageSelect').innerHTML=loaded.map((x,i)=>`<option value=\"${i}\">${i+1}. ${x.file.name} (${x.img.width}×${x.img.height})</option>`).join('');selected=0;showImage();setStatus(`${loaded.length} image(s) loaded. Tap Read screenshots.`)}catch(err){setStatus(err.message)}});\n$('imageSelect').addEventListener('change',e=>{selected=Number(e.target.value);showImage()});$('regions').addEventListener('change',showImage);\n$('clear').addEventListener('click',()=>{loaded=[];regionsByImage={};skillBoxes={};levelBoxes={};starBoxes={};resetFields();$('files').value='';$('imageSelect').innerHTML='<option>No image selected</option>';showImage();setStatus('Cleared.');$('testSummary').textContent='No screenshots read yet.';$('diagnostics').textContent='Run the reader to see raw OCR results here.';});\nconst preview=$('preview');\nfunction pointerPos(e){let r=preview.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];}\npreview.addEventListener('pointerdown',e=>{if(!loaded.length)return;let [px,py]=pointerPos(e);\n const boxes=[...skillRegions(selected).map((b,i)=>({target:'skill'+i,b})),{target:'level',b:levelBox(selected)},{target:'star',b:starBox(selected)}];\n const inside=b=>px>=b[0]&&px<=b[0]+b[2]&&py>=b[1]&&py<=b[1]+b[3];\n const handle=b=>Math.abs(px-b[0]-b[2])<.035&&Math.abs(py-b[1]-b[3])<.035;\n let chosen=boxes.find(x=>handle(x.b));let resize=false;\n if(!chosen)chosen=boxes.find(x=>inside(x.b));\n if(!chosen)return;drag={px,py,b:chosen.b.slice(),resize,target:chosen.target};preview.setPointerCapture(e.pointerId);e.preventDefault();\n});\npreview.addEventListener('pointermove',e=>{if(!drag)return;let [px,py]=pointerPos(e),[x,y,w,h]=drag.b,dx=px-drag.px,dy=py-drag.py;\n if(drag.resize){w=Math.max(.025,Math.min(1-x,w+dx));h=Math.max(.018,Math.min(1-y,h+dy));}\n else{x=Math.max(0,Math.min(1-w,x+dx));y=Math.max(0,Math.min(1-h,y+dy));}\n if(drag.target==='level')levelBoxes[selected]=[x,y,w,h];\n else if(drag.target==='star')starBoxes[selected]=[x,y,w,h];\n else skillRegions(selected)[Number(drag.target.slice(5))]=[x,y,w,h];\n showImage();e.preventDefault();\n});\n$('resetSkills').addEventListener('click',()=>{if(!loaded.length)return;skillBoxes[selected]=defaultSkillRegions();showImage();setStatus('Three skill boxes reset for selected screenshot.');});\n$('saveSkills').addEventListener('click',()=>{if(!loaded.length)return;savedLayouts[layoutKey(selected)]=skillRegions(selected).map(b=>[...b]);localStorage.setItem('toadReader31SkillLayouts',JSON.stringify(savedLayouts));setStatus('Skill layout saved for '+layoutKey(selected)+' screenshots.');});\npreview.addEventListener('pointerup',()=>drag=null);preview.addEventListener('pointercancel',()=>drag=null);\n$('run').addEventListener('click',async()=>{if(!loaded.length){setStatus('Choose one or more screenshots first.');return;}$('run').disabled=true;resetFields();regionsByImage={};let logs=[],detected=[];try{await getWorker();for(let i=0;i<loaded.length;i++){let im=loaded[i].img;setStatus(`Analyzing screenshot ${i+1}/${loaded.length}…`);\n// Both screen types use the same coordinates. Blank regions simply produce no values.\n// v3.3.8: Name-only band. Keep all passes above the scrolling notification strip.\n// The upper name band covers varying device layouts without extending into banners.\nconst top=[.24,.005,.52,.085],levBox=levelBox(i);\naddRegion(i,'Hero name',top);\nlet head=await read(im,top,'normal',Tesseract.PSM.SINGLE_LINE);\nlet name=heroName(head);let raw={head};\nif(!name){let h2=await read(im,top,'light',Tesseract.PSM.SINGLE_LINE);raw.headThreshold=h2;name=heroName(h2);}\nif(!name){let h3=await read(im,[.20,.005,.60,.085],'normal',Tesseract.PSM.SPARSE_TEXT);raw.headWide=h3;name=heroName(h3);}\nif(!name){for(const [label,box] of [['nameNarrow',[.30,.015,.40,.07]],['nameLower',[.20,.035,.60,.055]],['nameWide',[.10,.005,.80,.085]]]){\n let t=await read(im,box,'normal',Tesseract.PSM.SPARSE_TEXT);raw[label]=t;name=heroName(t);if(name)break;\n }}\n// v3.3.8: Additional name-only OCR passes for short or hard-to-read hero names.\n// Only run when the existing passes fail. Skill recognition is unchanged.\nif(!name){\n const namePasses=[\n  ['nameLightLine',[.24,.005,.52,.085],'light',Tesseract.PSM.SINGLE_LINE,6],\n  ['nameYellowLine',[.24,.005,.52,.085],'yellow',Tesseract.PSM.SINGLE_LINE,6],\n  ['nameLightWide',[.16,.005,.68,.085],'light',Tesseract.PSM.SPARSE_TEXT,5],\n  ['nameYellowWide',[.16,.005,.68,.085],'yellow',Tesseract.PSM.SPARSE_TEXT,5],\n  ['nameLightNarrow',[.30,.015,.40,.07],'light',Tesseract.PSM.SINGLE_WORD,7],\n  ['nameYellowNarrow',[.30,.015,.40,.07],'yellow',Tesseract.PSM.SINGLE_WORD,7]\n ];\n for(const [label,box,mode,psm,scale] of namePasses){\n  let t=await read(im,box,mode,psm,scale);raw[label]=t;\n  name=heroName(t);if(name)break;\n }\n}\nlet item={type:'unknown',name,file:loaded[i].file.name,raw};\n // Manually selected skill-icon rectangle; only first 3 quadrants are read.\n lockAllSkillBoxes(i);const qs=skillRegions(i);raw.individualSkillBoxes=JSON.stringify(qs);\n let skillHits=0;\n for(let j=0;j<3;j++){ // only primary skills 1-3; fourth skill handled elsewhere\n   const key='s'+(j+1),q=qs[j];addRegion(i,key+' adjustable box',q);\n   let v=null;\n    / ence.push({value:n,kind:\"bare\",attempt:k,method:mode+\"/\"+psm});}}\n      }\n    }\n    // Experimental extra OCR pass with the colored background removed. Never replace existing evidence.\n    for(const [k,variant] of [[11,'white'],[12,'soft']]){\n      const t=await readBackgroundRemoved(im,labelStrip,variant,Tesseract.PSM.SINGLE_LINE);\n      raw[key+'Attempt'+k]=t;\n      const matches=[...t.matchAll(/L\\s*v\\s*[.\\-:]?\\s*(\\d{1,2})/gi)].map(m=>Number(m[1])).filter(n=>n>=1&&n<=40);\n      for(const n of matches){readings.push(n);evidence.push({value:n,kind:'label',attempt:k,method:'background-'+variant+'/7'});}\n    }\n    // v3.3: count distinct processing methods, not duplicate passes on the same crop.\n    // Never silently prefer a truncated Lv.3 over a conflicting complete 30.\n    const byValue=new Map();\n    for(const e of evidence){\n      if(!byValue.has(e.value))byValue.set(e.value,{label:new Set(),bare:new Set()});\n      byValue.get(e.value)[e.kind].add(e.method);\n    }\n    const summary=[...byValue].map(([value,ev])=>({value,labelMethods:ev.label.size,bareMethods:ev.bare.size,methods:[...new Set([...ev.label,...ev.bare])]}));\n    const labelSupported=summary.filter(e=>e.labelMethods>=1);\n    const bareSupported=summary.filter(e=>e.bareMethods>=2);\n    let decision='insufficient evidence';\n    if(labelSupported.length===1){\n      // A complete level-labelled reading outranks isolated digits from artwork.\n      v=labelSupported[0].value;\n      const weaker=summary.filter(e=>e.value!==v&&e.bareMethods>0);\n      decision=weaker.length?'label-supported; ignored weaker bare candidates: '+weaker.map(e=>e.value).join(', '):'label-supported candidate';\n    }else if(labelSupported.length>1){\n      // v3.3.6: Resolve conflicting labels only with independent corroboration.\n      // A label counts as one method; a bare reading adds support but cannot\n      // independently win against a label. Duplicate passes of a method do not stack.\n      const ranked=[...labelSupported].map(e=>({...e,support:e.labelMethods+e.bareMethods}))\n        .sort((a,b)=>b.support-a.support);\n      const best=ranked[0], runner=ranked[1];\n      const one=labelSupported.find(e=>e.value===1);\n      const fourteen=labelSupported.find(e=>e.value===14);\n      const cleanOne=evidence.some(e=>e.value===1&&e.kind==='label'&&e.method.startsWith('background-'));\n      if(labelSupported.length===2&&one&&fourteen&&fourteen.labelMethods===1&&\n         (cleanOne||one.labelMethods>=1)){\n        v=1;\n        decision='Lv.1 preferred over single-method Lv.14 artifact; review recommended';\n      }else if(best.support>=3 && best.support-runner.support>=2 &&\n               best.labelMethods>=1 && ranked.every((e,i)=>i===0||e.support<best.support)){\n        v=best.value;\n        decision='independent method consensus ('+best.support+' vs '+runner.support+'); review recommended';\n      }else{\n        decision='conflicting labelled readings: '+labelSupported.map(e=>e.value).join(' vs ');\n      }\n    }else if(bareSupported.length===1){\n      v=bareSupported[0].value;decision='multiple independent bare methods';\n    }else if(bareSupported.length>1){\n      decision='conflicting bare readings: '+bareSupported.map(e=>e.value).join(' vs ');\n    }\n    raw[key+'LabelStripBox']=JSON.stringify(labelStrip);\n    raw[key+'Votes']=JSON.stringify({strong:readings,pure:pureReadings});\n    raw[key+'Decision']=JSON.stringify({result:v,status:decision,candidates:summary});\n   item[key]=v;if(v!==null)skillHits++;\n }\n// Classify: Skills page → name + skills only; Stats page → name + level + stars only\nif(skillHits>=1){\n  item.type='skills';\n  // Skills page: name + skills only — do not read level/stars\n  item.level=null;item.stars=null;\n}else{\n  item.type='stats';\n  // Stats page: name + level + stars only — discard any accidental skill hits\n  item.s1=null;item.s2=null;item.s3=null;\n  addRegion(i,'Hero level',levBox);\n  let levelText=await read(im,levBox);raw.level=levelText;\n  let lm=levelText.match(/(?:Level|LeveI|LV|Lv)\\s*[:.]?\\s*(\\d{1,3})/i);\n  if(!lm){let alt=await read(im,[.37,.78,.28,.14],'normal');raw.levelWide=alt;lm=alt.match(/(?:Level|LeveI|LV|Lv)\\s*[:.]?\\s*(\\d{1,3})/i);}\n  item.level=lm?Number(lm[1]):null;\n  const sb=starBox(i);addRegion(i,'Stars',sb);\n  item.stars=countStars(im,sb);raw.starsDetected=item.stars;\n  if(item.level===null&&item.stars===0)item.type='unknown';\n}\nif(item.type==='unknown')logs.push('Unknown screen: '+item.file+'; inspect detection regions');\n detected.push(item);logs.push(JSON.stringify(item,null,2));}\n// Merge: skills pages → name + skills; stats pages → name + level + stars\nlet statsPages=detected.filter(x=>x.type==='stats'),skillsPages=detected.filter(x=>x.type==='skills');\nlet names=[...new Set(detected.map(x=>x.name).filter(Boolean))];\nif(names.length===1)$('hero').value=names[0][0]+names[0].slice(1).toLowerCase();\nelse if(names.length>1)logs.push('WARNING: hero names do not match. Do not combine unrelated heroes.');\nlet stats=statsPages.find(x=>x.level!==null);\nif(stats&&stats.level!==null)$('level').value=stats.level;\nlet starSrc=statsPages.find(x=>x.stars>0)||statsPages.find(x=>x.stars!=null);\nif(starSrc&&starSrc.stars!=null)$('stars').value=starSrc.stars;\nfor(let item of skillsPages)for(let k of ['s1','s2','s3'])if(item[k]!==null)$(k).value=item[k];\n$('log').textContent=logs.join('\\n\\n');$('diagnostics').textContent=detected.map((d,i)=>'SCREEN '+(i+1)+' • '+d.file+'\\nClassification: '+d.type+'\\nName candidate: '+(d.name||'(none)')+'\\n\\nRAW OCR BY REGION\\n'+Object.entries(d.raw).map(([k,v])=>k+':\\n'+(v||'[no text detected]')).join('\\n\\n')).join('\\n\\n----------------\\n\\n');$('testSummary').textContent=detected.map(x=>`${x.file}: ${x.type.toUpperCase()}${x.name?' · '+x.name:''}`).join(' | ');showImage();setStatus(`Processed ${detected.length} screenshot(s). Review all values, especially stars and missing skill levels.`);\n}catch(err){console.error(err);setStatus('Reader error: '+err.message+'. Screenshots and Tracker data remain unchanged.');$('log').textContent+= '\\n'+String(err.stack||err);}finally{$('run').disabled=false;}});\nfunction exportData(){let hero=$('hero').value.trim();if(!hero)throw Error('Enter or confirm the hero name first.');let get=k=>$(k).value===''?null:Number($(k).value);return {format:'toad-screenshot-reader-review-v1',reviewedAt:new Date().toISOString(),hero,stars:get('stars'),level:get('level'),skills:[get('s1'),get('s2'),get('s3')],screenshots:loaded.map(x=>x.file.name),reviewedByPlayer:true,note:'Standalone reader output; not a direct Hero Tracker import.'};}\n$('download').addEventListener('click',()=>{try{let obj=exportData(),blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toad_reader_'+obj.hero.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);setStatus('Export requested. If your Android APK WebView blocks downloads, test in Chrome first.');}catch(e){setStatus(e.message)}});\n$('copy').addEventListener('click',async()=>{try{let s=JSON.stringify(exportData(),null,2);await navigator.clipboard.writeText(s);setStatus('Reviewed JSON copied.');}catch(e){setStatus('Copy failed: '+e.message)}});\n\n// Beta Test Center integration: review is required before any tracker updates.\n$('syncTracker').addEventListener('click',()=>{\n try{\n  const data=exportData();\n  if(![data.stars,data.level,...data.skills].some(v=>v!==null))throw Error('No stars, hero level, or skills to sync.');\n  if(window.parent===window)throw Error('Open this reader from Beta Test Center to sync.');\n  if(!confirm('Sync reviewed '+data.hero+' values to Hero Tracker? Blank fields stay unchanged.'))return;\n  window.parent.postMessage({type:'toad-reader-sync',payload:data},'*');\n  set APPS.voice="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Voice Entry</title><style>\n:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px system-ui,Arial;background:#101522;color:#e9edf8;padding:16px;max-width:900px;margin:auto}h2{margin-top:0}.card{background:#1a2233;border:1px solid #36415b;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:#b8c4dc;margin:10px 0}input,select,textarea{display:block;width:100%;padding:10px;margin-top:5px;background:#222d43;color:white;border:1px solid #53617b;border-radius:8px;font:inherit}button{padding:11px;background:#273b5e;color:white;border:1px solid #4a6288;border-radius:9px;font:inherit}.primary{background:#7454d6}.muted{color:#b8c4dc;font-size:13px}.status{padding:10px;color:#c5b7ff}.row{display:flex;gap:8px}.row button{flex:1}</style></head><body>\n<h2>🎙️ Voice Entry · Expanded Beta</h2><p class=\"muted\">Choose a hero, then speak any combination of tracked hero fields. Blank review fields remain unchanged. Skill 4 is calculated automatically in the Tracker.</p>\n<div class=\"card\"><label>Hero<select id=\"hero\"></select></label><div class=\"row\"><button id=\"listen\" class=\"primary\">🎙️ Start listening</button><button id=\"stop\">Stop</button></div><label>Transcript (editable)<textarea id=\"words\" rows=\"4\" placeholder=\"level 160, nine stars, skills 30 30 35, weapon level 8, fragments 450, priority 2\"></textarea></label><button id=\"parse\">Interpret words</button><div class=\"status\" id=\"status\">Ready. Speak or type an update.</div></div>\n<div class=\"card\"><h3>Review before saving</h3><p class=\"muted\">Only filled fields will change. Whole stars 0–10. You can also correct values manually.</p><div class=\"grid\">\n<label>Hero level<input id=\"level\" type=\"number\" min=\"0\" max=\"999\" placehol const ENCYCLOPEDIA_CLASSES={"tarzan":"Guard","layla":"Gunner","becca":"Marksman","rosie":"Guard","chiron":"Gunner","jacob":"Guard","ragnar":"Guard","wright":"Gunner","shark":"Guard","ray":"Gunner","candy":"Gunner","tony":"Guard","kiki":"Marksman","mike":"Guard","maddie":"Marksman","tara":"Guard","nikola":"Guard"};
const TRACKER_FACTIONS={"nikola":"Stalwarts","ray":"Stalwarts","rosie":"Stalwarts","tara":"Stalwarts","tarzan":"Stalwarts","becca":"Rovers","candy":"Rovers","chiron":"Rovers","jacob":"Rovers","layla":"Rovers","dave":"Aeronauts","kiki":"Aeronauts","maddie":"Aeronauts","mike":"Aeronauts","tony":"Aeronauts","wright":"Aeronauts","knottie":"Mariners","ragnar":"Mariners","shark":"Mariners","undine":"Mariners"};
function normalizeBuilderFaction(value){
 const key=String(value||'').trim().toLowerCase();
 return ({stalwarts:'Stalwart',stalwart:'Stalwart',rovers:'Rover',rover:'Rover',aeronauts:'Aeronaut',aeronaut:'Aeronaut',mariners:'Mariner',mariner:'Mariner'})[key]||value;
}
function sync(){
 const tracker=read(KEYS[0]);
 if(!tracker||!Array.isArray(tracker.heroes)){status('Import or enter tester hero data in Tracker first.');return}
 let roster=read(KEYS[1]);if(!Array.isArray(roster))roster=[];
 const existing=new Map(roster.map(h=>[String(h.name||'').trim().toLowerCase(),h]));
 const templates=new Map(BUILDER_TEMPLATES.map(h=>[String(h.name||'').trim().toLowerCase(),h]));
 const tracked=tracker.heroes.filter(t=>String(t.name||'').trim()&&(Number(t.stars)>0||Number(t.level)>0));
 if(!tracked.length){status('No tracked heroes with stars or levels. Import tester progress first.');return}
 const trackedNames=new Set(tracked.map(t=>String(t.name).trim().toLowerCase()));
 // Existing reference roster is not evidence of tester ownership.
 for(const h of roster){if(!trackedNames.has(String(h.name||'').trim().toLowerCase()))h.available=false}
 let updated=0,added=0;
 for(const t of tracked){
  const name=String(t.name).trim(),k=name.toLowerCase();let h=existing.get(k);
  if(!h){
   const template=templates.get(k);
   h=template?{...template}:{id:'beta-tracked-'+k.replace(/[^a-z0-9]+/g,'-'),name,faction:'Unknown',class:'Unknown',tags:[]};
   h.id='beta-tracked-'+k.replace(/[^a-z0-9]+/g,'-');h.name=name;
   // Reference progress is not the beta tester's progress.
   h.level=0;h.stars=null;h.skillLevel=0;h.skillLevels=[];h.weaponLevel=0;h.power=0;
   delete h.skills;roster.push(h);existing.set(k,h);added++;
  }else{updated++}
  h.available=true;
  h.faction=normalizeBuilderFaction(h.faction);
  if(Number(t.stars)>0)h.stars=Number(t.stars);
  if(Number(t.level)>0)h.level=Number(t.level);
  const skills=[t.skill1,t.skill2,t.skill3].map(Number);
  if(skills.every(x=>Number.isFinite(x)&&x>0)){h.skillLevels=skills;h.skillLevel=Math.min(...skills)}
  // Do not infer a signature weapon from the fourth hero-skill icon.
  // Only a positive, explicitly tracked signature-gear value can update this field.
  if(Number(t.sig)>0)h.weaponLevel=Number(t.sig);
  // Use the Tracker's known faction and the documented combat class.
  // Do not overwrite an existing verified class with Unknown.
  const documentedClass=ENCYCLOPEDIA_CLASSES[k];
  if(documentedClass)h.class=documentedClass;
  if(t.faction&&t.faction!=='Unknown')h.faction=normalizeBuilderFaction(t.faction);
  else if(TRACKER_FACTIONS[k])h.faction=normalizeBuilderFaction(TRACKER_FACTIONS[k]);
  else if((!h.faction||h.faction==='Unknown')&&templates.get(k)?.faction&&templates.get(k).faction!=='Unknown')h.faction=templates.get(k).faction;
 }
 localStorage.setItem(KEYS[1],JSON.stringify(roster));
 if(loaded.has('builder'))document.getElementById('builder').srcdoc=APPS.builder;
 const missing=tracked.filter(t=>{const h=existing.get(String(t.name).trim().toLowerCase());return !h||!h.faction||h.faction==='Unknown'||!h.class||h.class==='Unknown'}).length;
 status('Synced '+tracked.length+' tracked heroes ('+added+' added, '+updated+' updated). Untracked heroes marked unavailable.'+(missing?' '+missing+' heroes still need verified faction/class in Builder.':''));
}
// Reader-to-tracker bridge. Parent owns the beta storage and Builder sync.
window.addEventListener('message',event=>{
 if(event.source!==document.getElementById('reader').contentWindow && event.source!==document.getElementById('voice').contentWindow)return;
 if(!event.data||event.data.type!=='toad-reader-sync')return;
 const respond=message=>event.source.postMessage({type:'toad-reader-sync-result',message},'*');
 try{
  const data=event.data.payload;
  if(!data||typeof data.hero!=='string')throw Error('Invalid reader data.');
  const name=data.hero.trim();
  if(!name)throw Error('Hero name is required.');
  // A clean Beta profile has no saved Tracker data until the first manual edit.
  // Initialize the exact blank shape used by the embedded Hero Tracker.
  const heroNames=['Undine','Shark','Ray','Tara','Becca','Jacob','Layla','Rosie','Chiron','Nikola','Mike','Tony','Kiki','Wright','Maddie','Candy','Ragnar','Knotty','Tarzan','Dave'];
  const srNames=['General','Chef','Travis','Freja','Eva','Lucky','Sarge'];
  let tracker=read(KEYS[0]);
  if(!tracker||!Array.isArray(tracker.heroes)){
    tracker={settings:{player:'',power:'',style:''},heroes:heroNames.map(name=>({name,stars:0,level:0,skill1:0,skill2:0,skill3:0,sig:0,frags:0,priority:0})),gear:[],scraps:{},sr:Object.fromEntries(srNames.map(n=>[n,0])),srGoal:10000};
  }
  let hero=tracker.heroes.find(h=>String(h.name||'').trim().toLowerCase()===name.toLowerCase() || (name.toLowerCase()==='knotty'&&String(h.name||'').trim().toLowerCase()==='knottie'));
  if(!hero)throw Error(name+' is not a recognized Hero Tracker hero. Check the name.');
  if(hero.name.toLowerCase()==='knottie')hero.name='Knotty';
  let count=0;
  function update(field,val,max){
   if(val===null||val===undefined||val==='')return;
   const n=Number(val);
   if(!Number.isFinite(n)||n<0||n>max)throw Error('Invalid '+field+' value.');
   hero[field]=n;count++;
  }
  update('stars',data.stars,10);
  update('level',data.level,999);
  for(let i=0;i<3;i++)update('skill'+(i+1),Array.isArray(data.skills)?data.skills[i]:null,40);
  update('sig',data.sig,999);
  update('frags',data.frags,9999999);
  update('priority',data.priority,9999);
  if(!count)throw Error('No reviewed values to sync.');
  localStorage.setItem(KEYS[0],JSON.stringify(tracker));
  // Only update Tracker; Builder is intentionally updated by the separate Tracker → Builder button.
  if(loaded.has('tracker'))document.getElementById('tracker').srcdoc=APPS.tracker;
  const message='Synced '+name+' ('+count+' fields) to Hero Tracker. Use Tracker → Builder when ready. Blank fields preserved.';
  status(message);respond(message);
 }catch(err){const message='Sync failed: '+err.message;status(message);respond(message)}
});
document.getElementById('sync').onclick=sync;
document.getElementById('export').onclick=()=>{const data={format:'beta-test-center-backup',version:1,created:new Date().toISOString(),storage:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('beta-test-center-'))data.storage[k]=localStorage.getItem(k)}const json=JSON.stringify(data,null,2),name='beta_test_center_backup.json';if(window.ToadBackupBridge&&typeof window.ToadBackupBridge.saveBase64==='function'){const bytes=new TextEncoder().encode(json);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));window.ToadBackupBridge.saveBase64(name,btoa(binary));status('Backup sent to Android Downloads.');}else{const blob=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('Backup exported.')}};
document.getElementById('import').onclick=()=>document.getElementById('backupFile').click();
document.getElementById('backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='beta-test-center-backup'||!data.storage||typeof data.storage!=='object')throw Error('Not a Beta Test Center backup');if(!confirm('Restore beta backup? This replaces saved Tracker and Builder data.'))return;let n=0;for(const [k,v] of Object.entries(data.storage)){if((k.startsWith('beta-test-center-'))&&typeof v==='string'){localStorage.setItem(k,v);n++}}for(const id of loaded)document.getElementById(id).srcdoc=APPS[id];status('Restored '+n+' saved records.')}catch(err){status('Restore failed: '+err.message)}e.target.value=''};
load('tracker');
